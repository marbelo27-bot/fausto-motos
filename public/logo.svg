<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Background -->
  <rect width="200" height="80" rx="10" fill="#1a1a2e"/>
  
  <!-- Motorcycle icon -->
  <g transform="translate(12, 10)">
    <!-- Wheels -->
    <circle cx="14" cy="46" r="12" fill="none" stroke="#2596be" stroke-width="3"/>
    <circle cx="14" cy="46" r="4" fill="#2596be"/>
    <circle cx="54" cy="46" r="12" fill="none" stroke="#2596be" stroke-width="3"/>
    <circle cx="54" cy="46" r="4" fill="#2596be"/>
    <!-- Body -->
    <path d="M14 46 L22 28 L38 24 L54 46" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M22 28 L30 20 L42 20 L38 28 Z" fill="#2596be"/>
    <!-- Handlebar -->
    <line x1="38" y1="24" x2="44" y2="18" stroke="#f5a623" stroke-width="2"/>
    <line x1="44" y1="18" x2="50" y2="20" stroke="#f5a623" stroke-width="2"/>
    <!-- Exhaust -->
    <path d="M22 40 L10 44" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Workshop name -->
  <text x="88" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">FAUSTO</text>
  <text x="88" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2596be">MOTOS</text>
  <text x="88" y="65" font-family="Arial, sans-serif" font-size="9" fill="#64748b" letter-spacing="1">SISTEMA DE GESTIÓN</text>
</svg>
